<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes tâches — organisé, simplement</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#202633;background:#f4f6fb;font-synthesis:none;text-rendering:optimizeLegibility;--muted:#758096;--line:#e8ebf2;--purple:#6857e8;--green:#24a77a}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 82% 4%,#e8e5ff 0,transparent 36%),#f4f6fb;padding:56px 22px 80px}
    html{scroll-behavior:smooth;scroll-padding-top:22px}#app{max-width:850px;margin:0 auto}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.topbar-actions{display:flex;align-items:center;gap:12px}.mechanism-shortcut{font-size:12px;font-weight:650;color:#5748d0;text-decoration:none;background:#f0eeff;border:1px solid #ded9ff;padding:9px 13px;border-radius:20px}.mechanism-shortcut:hover{background:#e8e4ff}.eyebrow{font-size:10px;font-weight:750;letter-spacing:.15em;color:var(--purple);margin:0 0 7px}h1{font-size:34px;letter-spacing:-.04em;margin:0;color:#171c29}h2{font-size:19px;letter-spacing:-.025em;margin:0}.storage-badge{font-size:12px;color:#43886e;background:#e5f5ee;padding:9px 13px;border-radius:20px}
    .panel{background:#fff;border:1px solid #e8eaf1;border-radius:17px;padding:24px 27px;box-shadow:0 10px 32px #2630540b;margin-bottom:17px}.section-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.inline-form,.task-entry{display:flex;gap:10px}.inline-form{margin-bottom:17px}input,select,button{font:inherit}input[type=text],input[type=date],select{border:1px solid #dfe3ec;border-radius:9px;background:#fff;padding:11px 13px;color:#252b37;min-width:0}input[type=text]:focus,input[type=date]:focus,select:focus{outline:3px solid #6857e82b;border-color:var(--purple)}.inline-form input{flex:1}.primary{border:0;border-radius:9px;padding:10px 16px;color:#fff;background:var(--purple);font-weight:650;cursor:pointer}.primary:hover{background:#5745d5}.secondary{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 11px;color:#565e70;cursor:pointer}
    .project-list,.task-list{list-style:none;padding:0;margin:0}.project-list{display:flex;flex-wrap:wrap;gap:8px}.project-item{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}.project-item.active{border-color:#b9b1ff;background:#f5f3ff}.select-project{border:0;background:transparent;padding:9px 12px;color:#555e70;cursor:pointer}.active .select-project{color:#5545d2;font-weight:700}.icon-button{border:0;background:transparent;color:#9299a8;font-size:20px;padding:4px 10px;cursor:pointer}.icon-button:hover{color:#cb4a62}.task-form{margin-top:8px}.task-form>label{display:block;color:#444b5a;font-size:13px;font-weight:650;margin-bottom:8px}.task-entry input[type=text]{flex:1}.date-field{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.date-field input{padding:9px 8px;max-width:155px}.progress-panel{margin:22px 0 12px}.progress-copy{display:flex;justify-content:space-between;align-items:center;color:#70798b;font-size:12px;margin-bottom:9px}.progress-copy strong{font-size:13px;color:#5141cc}.progress-track{height:7px;border-radius:10px;background:#eeedf6;overflow:hidden}.progress-track span{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#8575f4,#5b4be0);transition:width .18s ease}.task-list{margin-top:12px}.task-item{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid #f0f1f5}.task-item:last-child{border-bottom:0}.task-item .toggle{width:18px;height:18px;accent-color:var(--green);cursor:pointer}.task-content{display:flex;align-items:center;gap:10px;flex:1;min-width:0}.title{overflow-wrap:anywhere}.done .title{text-decoration:line-through;color:#939aaa}.deadline{font-size:11px;color:#858da0;background:#f4f5f8;border-radius:20px;padding:4px 9px;white-space:nowrap}.empty-state{text-align:center;color:#9299a8;padding:22px 5px 8px;font-size:13px}.error{color:#b6334a;background:#fff0f2;border-radius:8px;padding:9px 12px;font-size:13px;margin:9px 0}.edit-form{display:flex;align-items:center;gap:8px;width:100%}.edit-input{flex:1}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}[hidden]{display:none!important}
    .test-results-updated{font-size:11px;color:var(--muted);margin:-8px 0 16px}.test-result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.test-result-card{border:1px solid #eaebf2;background:#fcfcff;border-radius:12px;padding:15px;min-width:0}.test-result-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.test-result-heading h3{margin:0;font-size:13px;line-height:1.4;color:#313848}.result-badge{font-size:10px;color:#778096;background:#eef0f5;padding:4px 7px;border-radius:20px;white-space:nowrap}.result-badge-success{background:#e5f5ee;color:#348468}.result-badge-failure{background:#fff0f2;color:#b6334a}.test-result-value{display:block;color:#5545d2;font-size:25px;letter-spacing:-.03em;margin-top:16px}.test-result-caption{font-size:10px;color:#858da0}.test-result-detail{font-size:11px;color:#667084;line-height:1.5;margin:12px 0 0}.metric-bars{display:grid;gap:9px;margin-top:17px}.metric-bars label{display:grid;grid-template-columns:1fr auto;gap:5px;font-size:10px;color:#778096}.metric-track{grid-column:1/-1;height:5px;background:#edecf5;border-radius:9px;overflow:hidden}.metric-track i{display:block;width:0;height:100%;background:linear-gradient(90deg,#8575f4,#5b4be0);border-radius:9px;transition:width .25s ease}.test-results-note{margin:14px 0 0;font-size:11px;color:#8991a1;line-height:1.55}.mechanism-panel{margin-top:22px}.mechanism-intro,.test-mechanism p{font-size:13px;line-height:1.6;color:#70798b}.mechanism-actions{display:flex;flex-wrap:wrap;gap:8px;margin:17px 0}.mechanism-choice{border:1px solid var(--line);border-radius:20px;background:#fff;padding:8px 13px;color:#626b7d;font-size:12px;cursor:pointer}.mechanism-choice.active{background:#f1efff;color:#5141cc;border-color:#c9c2ff;font-weight:700}.mechanism-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;list-style:none;padding:0;margin:18px 0 23px}.mechanism-steps li{display:flex;flex-direction:column;gap:7px;min-height:110px;padding:13px;border:1px solid #ececf4;border-radius:11px;background:#fafaff}.mechanism-steps strong{font-size:12px;color:#4f42c5}.mechanism-steps span{font-size:11px;line-height:1.55;color:#667084}.test-mechanism{border-top:1px solid var(--line);padding-top:17px;font-size:12px;color:#525c6e}.test-mechanism>strong{font-size:13px;color:#252b37}.test-mechanism ol{padding-left:20px;line-height:1.8}.test-mechanism code{font-size:11px;background:#f1f2f7;border-radius:4px;padding:2px 5px;color:#5141cc}
    @media(max-width:620px){body{padding:28px 14px 55px}.topbar{align-items:flex-start;gap:10px}.topbar-actions{align-items:flex-end;flex-direction:column-reverse;gap:7px}.mechanism-shortcut,.storage-badge{font-size:10px;padding:7px 9px}h1{font-size:29px}.panel{padding:19px 16px}.inline-form,.task-entry{flex-wrap:wrap}.inline-form input,.task-entry input[type=text]{flex-basis:100%}.date-field{flex:1}.edit-form{flex-wrap:wrap}.edit-form input,.edit-form select{flex:1 1 36%}.task-content{align-items:flex-start;flex-direction:column;gap:4px}.task-item{gap:9px}.mechanism-steps{grid-template-columns:1fr 1fr}.mechanism-steps li{min-height:unset}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
